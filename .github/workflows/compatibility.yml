name: Laravel compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        exclude:
          - php: '8.2'
            laravel: '13'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - name: Install into a fresh application and run integration checks
        run: |
          cp -R tests/app "$RUNNER_TEMP/radianz-consumer"
          cd "$RUNNER_TEMP/radianz-consumer"
          composer config repositories.radianz path "$GITHUB_WORKSPACE"
          composer require "laravel/framework:^${{ matrix.laravel }}.0" --no-interaction --prefer-dist
          php run.php check.php
          php run.php stale-cache.php
